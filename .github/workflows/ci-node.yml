name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: "JSON array of Node versions to test against"
        type: string
        default: '["22", "24"]'
      lint-node-version:
        description: "Node version for linting (should be latest LTS)"
        type: string
        default: "24"
      run-audit:
        description: "Run npm audit security check"
        type: boolean
        default: true
      run-secret-scan:
        description: "Run gitleaks secret scan"
        type: boolean
        default: true
      run-build:
        description: "Run npm run build"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.lint-node-version }}
          check-latest: true
          cache: "npm"

      - run: npm ci
      - run: npm run lint --if-present

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    if: inputs.run-build
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.lint-node-version }}
          check-latest: true
          cache: "npm"

      - run: npm ci
      - run: npm run build --if-present

  # Required check for rulesets: every job, not only the test matrix. `Test Result` needs
  # `test` alone, so a PR red on Security still showed it green (gowsay #15). A job its
  # input disabled reports `skipped` and passes; a job skipped because a dependency failed
  # is caught by that dependency. lint and test are never optional, so they must succeed.
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [lint, test, build, secret-scan, audit]
    if: always()
    steps:
      - name: Verify every job succeeded or was disabled by input
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")
            and .lint.result == "success" and .test.result == "success"' >/dev/null

  secret-scan:
    name: Secret Scan
    if: inputs.run-secret-scan
    uses: 1mb-dev/.github/.github/workflows/secret-scan.yml@main

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: inputs.run-audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.lint-node-version }}
          check-latest: true
          cache: "npm"

      - run: npm ci
      # Blocking: what ships. --omit=dev is a scope boundary, not reachability -- an app whose
      # bundler (vite, wrangler) is a devDependency can still emit vulnerable dev code into its
      # artifact, which the full-tree step below reports. One retry so a registry 5xx is not a
      # red with no vulnerability behind it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high || { sleep 10; npm audit --omit=dev --audit-level=high; }
      - name: Audit full tree (report only)
        continue-on-error: true
        run: |
          npm audit --json > audit.json || true
          jq -r '.metadata.vulnerabilities | "Full-tree audit: \(.critical) critical, \(.high) high, \(.moderate) moderate"' audit.json | tee -a "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high
