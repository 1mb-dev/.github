name: Go CI

on:
  workflow_call:
    inputs:
      go-versions:
        description: "JSON array of Go versions to test against"
        type: string
        default: '["1.26", "1.27"]'
      lint-go-version:
        description: "Go version for linting (should be latest)"
        type: string
        default: "1.26"
      golangci-lint-version:
        description: "golangci-lint version"
        type: string
        default: "v2.9.0"
      coverage-threshold:
        description: "Minimum coverage percentage (0 to skip)"
        type: number
        default: 0
      run-security:
        description: "Run govulncheck security scan"
        type: boolean
        default: true
      run-secret-scan:
        description: "Run gitleaks secret scan"
        type: boolean
        default: true
      build-binary:
        description: "Build binary (set to main package path, empty to skip)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.lint-go-version }}
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -diff
          go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ${{ fromJSON(inputs.go-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Run tests
        if: matrix.go-version != inputs.lint-go-version
        run: go test -race ./...

      - name: Run tests with coverage
        if: matrix.go-version == inputs.lint-go-version
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        if: inputs.coverage-threshold > 0 && matrix.go-version == inputs.lint-go-version
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          threshold=${{ inputs.coverage-threshold }}
          echo "Coverage: ${total}% (threshold: ${threshold}%)"
          if (( $(echo "$total < $threshold" | bc -l) )); then
            echo "Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  # Stable-named gate for branch protection. The `test` matrix leaks its Go version into
  # the check context (`Test (Go 1.26.5)`), and required-status-checks match by exact
  # name — so a toolchain bump renames the check and silently orphans the rule, leaving
  # PRs MERGEABLE but BLOCKED with everything green. Require this job instead of a matrix
  # leg: it never renames. `always()` so a failed or skipped matrix reports here rather
  # than leaving the required check pending forever.
  test-result:
    name: Test Result
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify the test matrix succeeded
        run: |
          result='${{ needs.test.result }}'
          echo "Test matrix result: $result"
          [ "$result" = "success" ] || exit 1

  # Required check for rulesets: every job, not only the test matrix. `Test Result` needs
  # `test` alone, so a PR red on Security still showed it green (gowsay #15). A job its
  # input disabled reports `skipped` and passes; a job skipped because a dependency failed
  # is caught by that dependency. lint and test are never optional, so they must succeed.
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan, security, build]
    if: always()
    steps:
      - name: Verify every job succeeded or was disabled by input
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")
            and .lint.result == "success" and .test.result == "success"' >/dev/null

  secret-scan:
    name: Secret Scan
    if: inputs.run-secret-scan
    uses: 1mb-dev/.github/.github/workflows/secret-scan.yml@main

  security:
    name: Security
    runs-on: ubuntu-latest
    if: inputs.run-security
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.lint-go-version }}
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    if: inputs.build-binary != ''
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.lint-go-version }}
          check-latest: true

      - name: Build binary
        run: go build -o /dev/null ${{ inputs.build-binary }}
