name: Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Gitleaks binary version"
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: "sha256 of gitleaks_<version>_linux_x64.tar.gz; required when gitleaks-version is overridden"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install and run gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
          # Hash of the default version's tarball, from gitleaks' published checksums file.
          # Bump together with the gitleaks-version default.
          DEFAULT_VERSION: "8.30.1"
          DEFAULT_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          if [ -z "$SHA256" ]; then
            if [ "$VERSION" != "$DEFAULT_VERSION" ]; then
              echo "gitleaks-version $VERSION overridden without gitleaks-sha256; pass the tarball's sha256" >&2
              exit 1
            fi
            SHA256=$DEFAULT_SHA256
          fi
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
